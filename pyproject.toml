[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenAstro2"
version = "2.0.0"
description = "Open Source Astrology 2"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "GPL" }
authors = [
    { name = "Pelle van der Scheer + DimmAstro" },
]
urls = { Homepage = "https://github.com/dimmastro/openastro2" }
dependencies = [
    "pyswisseph==2.10.3.2",
    "pytz",
    "jsonpickle",
    "requests==2.31.0",
    "pydantic",
    "terminaltables",
    "skyfield==1.46",
    "pydeck==0.8.0",
    "svgwrite==1.4.3",
    "numpy==1.26.4",
    "ephem==4.2",
    "geographiclib==2.0",
    "json5==0.12.1",
    "spiceypy==8.0.1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = ["openastro2.tests", "openastro2.tests.*"]

[tool.setuptools.package-data]
openastro2 = [
    "VERSION",
    "de421.bsp",
    "openastro2_makePlanets_block.txt",
    "settings/*",
    "xml/*",
    "icons/*",
    "icons/aspects/*",
    "locale/templates/*",
    "locale/*/LC_MESSAGES/*",
    "swiss_ephemeris/*",
]
